[build-system]
requires = ["setuptools>=65"]
build-backend = "setuptools.build_meta"

[project]
name = "argus-vision-bus"
version = "0.3.0"
description = "C++ onboard orchestration with Python image workers and bus tools"
requires-python = ">=3.11"
dependencies = ["msgpack>=1.0,<2", "numpy>=1.24,<2", "opencv-python-headless>=4.6,<5", "pyzmq>=24,<28"]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[project.scripts]
argus-busd = "argus_workers.transport.BusProxy:main"
argus-onboard = "argus_workers.tools.OnboardLauncher:main"
argus-vision = "argus_workers.tools.OnboardLauncher:main"
argus-detection-sub = "argus_workers.tools.DetectionSubscriber:main"
argus-preview-sub = "argus_workers.tools.PreviewSubscriber:main"
argus-hardware-check = "argus_workers.tools.HardwareCheck:main"

[tool.setuptools.packages.find]
where = ["python"]

[tool.pytest.ini_options]
testpaths = ["tests/integration"]
