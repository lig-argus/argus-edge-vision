# QGC 로 PX4 파라미터, 보정을 할 때만 /etc/mavlink-router/config.d/ 에 복사하고 라우터를 다시 시작한다.
# main.conf 의 [UdpEndpoint qgc] BlockSrcSysIn = 255 를 덮어쓴다. 라우터는 빈 값을 오류로 거부하므로
# 어느 장치도 사용하지 않는 sysid 0 을 지정해 사실상 아무것도 차단하지 않게 한다.
# 비행 전에 이 파일을 /etc/mavlink-router/config.d/ 에서 삭제한다 (절차는 README.md).
[UdpEndpoint qgc]
BlockSrcSysIn = 0
