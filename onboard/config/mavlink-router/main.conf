# mavlink-router 설정 — 비행 구성 (FC 와 RPi 를 UART 로 연결)
# 설치 위치: /etc/mavlink-router/main.conf (설치, 확인 절차는 같은 폴더의 README.md)
# 근거: docs/spec/icd.md 1.2 링크 표. 포트, 주소를 바꾸면 해당 표도 함께 수정한다.
# 주석은 줄 전체로만 작성한다 (mavlink-router 는 줄 끝 주석을 허용하지 않는다).

[General]
# MAVLink 는 UDP 로만 중계한다. TCP 서버(기본 5760)는 사용하지 않는다
TcpServerPort = 0
DebugLogLevel = info
ReportStats = false

# FC ↔ RPi: PX4 TELEM2, 921600 bps (icd 1.2 "FC ↔ RPi")
[UartEndpoint fc]
Device = /dev/ttyAMA0
Baud = 921600

# 라우터 ↔ onboard: RPi 안 UDP. onboard 가 127.0.0.1:14540 을 bind 하고 라우터가 그 주소로 보낸다
# (icd 1.2 "RPi 라우터 ↔ onboard")
[UdpEndpoint onboard]
Mode = Normal
Address = 127.0.0.1
Port = 14540

# 라우터 ↔ 통제기: Wi-Fi UDP. 라우터가 14550 을 열고, 통제기가 먼저 보내면 그 주소로 응답한다
# (icd 1.2 "RPi 라우터 ↔ 통제기")
[UdpEndpoint gcs]
Mode = Server
Address = 0.0.0.0
Port = 14550

# 라우터 ↔ QGC: Wi-Fi UDP 14551. PX4 파라미터, 보정 전용 (icd 1.1)
# 비행 중 QGC 는 읽기 전용이다: QGC(sysid 255)가 보낸 패킷은 모두 폐기한다 (FC 로도 onboard 로도 가지 않음).
# 명령은 모두 COMMAND_LONG 한 메시지로 가므로 메시지 id 로는 비행 명령만 골라 막을 수 없고,
# ArduPilot 의 GCS sysid 검사(GCS_SYSID_ENFORCE)처럼 보낸 쪽 sysid 로 필터링한다. PX4 에는 이 기능이 없어 라우터에서 한다.
# 파라미터, 보정 때는 config.d/qgc-maintenance.conf 를 /etc/mavlink-router/config.d/ 에 추가해 이 값을 덮어쓴다
# (절차는 README.md). 비행 전에 그 파일을 삭제한다.
[UdpEndpoint qgc]
Mode = Server
Address = 0.0.0.0
Port = 14551
BlockSrcSysIn = 255
