// control/setpoint: 추종 제어 → onboard, 20 Hz (docs/spec/process_interfaces.md 5.1)
// C++ 값 타입 vehicle_api::VelocitySetpoint 과 필드가 같다. 변환은 어댑터(vehicle_api_zmq)가 한다.
// 필드 번호는 바꾸지 않는다. 필드를 지우면 번호를 reserved 로 남긴다.
syntax = "proto3";

package argus.msg;

message ControlSetpoint {
  uint64 seq = 1;  // 발행마다 1 증가 (3장 공통 필드)
  // FRD(전진, 우측, 하강) 속도 (m/s)
  double forward_m_s = 2;
  double right_m_s = 3;
  double down_m_s = 4;
  double yaw_rate_rad_s = 5;  // 양수 = 시계 방향
  // 이 시각(RPi CLOCK_MONOTONIC, ns)이 지나면 onboard 는 이 값을 쓰지 않는다
  int64 valid_until_monotonic_ns = 6;
}
