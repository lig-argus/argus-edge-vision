// 여러 메시지가 함께 쓰는 타입 (docs/spec/process_interfaces.md 3장)
// C++ 값 타입 vehicle_api::RequestId, RequestHeader, FlightMode 와 필드가 같다.
// 필드 번호는 바꾸지 않는다. 필드를 지우면 번호를 reserved 로 남긴다.
syntax = "proto3";

package argus.msg;

// 프로세스 사이 요청 하나를 가리키는 값. 응답은 요청의 값을 그대로 남긴다
message RequestId {
  uint64 command_id = 1;
  string session_id = 2;  // 요청자 세션
  uint64 seq = 3;
  uint64 fc_epoch = 4;  // 요청을 만들 때의 FC 연결 epoch
}

// 요청 공통 필드
message RequestHeader {
  RequestId id = 1;
  // 이 시각(RPi CLOCK_MONOTONIC, ns)이 지나면 실행하지 않는다
  int64 valid_until_monotonic_ns = 2;
}

// PX4 비행 모드 (docs/spec/icd.md 부록 A)
enum FlightMode {
  FLIGHT_MODE_UNKNOWN = 0;
  FLIGHT_MODE_MANUAL = 1;
  FLIGHT_MODE_STABILIZED = 2;
  FLIGHT_MODE_ALTITUDE = 3;
  FLIGHT_MODE_POSITION = 4;
  FLIGHT_MODE_OFFBOARD = 5;
  FLIGHT_MODE_HOLD = 6;
  FLIGHT_MODE_RETURN = 7;
  FLIGHT_MODE_LAND = 8;
  FLIGHT_MODE_TAKEOFF = 9;
  FLIGHT_MODE_MISSION = 10;
}
