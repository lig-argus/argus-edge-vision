name: ci

on:
  pull_request:
  push:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  format:
    name: clang-format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      # 로컬과 같은 clang-format 23 (버전이 다르면 같은 설정으로도 결과가 다르다)
      - run: pip install clang-format==23.1.3
      - run: git ls-files '*.cpp' '*.hpp' '*.h' ':!common/mavlink/generated' | xargs -r clang-format --dry-run -Werror

  # onboard·gcs 빌드·gtest·clang-tidy 작업은 CMake 프로젝트가 생기는 PR에서 추가한다
  # (argus-onboard/.github/workflows/ci.yml 의 onboard·gcs 작업과 같은 모양)
