name: ci

on:
  pull_request:
  push:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  format:
    name: clang-format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      # 로컬과 같은 clang-format 23 (버전이 다르면 같은 설정으로도 결과가 다르다)
      - run: pip install clang-format==23.1.3
      - run: git ls-files '*.cpp' '*.hpp' '*.h' ':!common/mavlink/generated' | xargs -r clang-format --dry-run -Werror
      # 기본 정수 타입 int, unsigned 의 사용 검사 (CONTRIBUTING.md 0.2 "C++ 정수 타입")
      - run: tools/check_int.sh

  python:
    name: python lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      # 로컬과 같은 Ruff·mypy (tools/requirements-lint.txt). 규칙은 pyproject.toml
      - run: pip install -r tools/requirements-lint.txt
      - run: ruff format --check .
      - run: ruff check .
      # hook 과 같이 git 이 관리하는 .py 전체를 검사한다 (protobuf 생성 코드 *_pb2.py 제외). .py 가 없으면 건너뛴다
      - name: mypy
        run: |
          if git ls-files '*.py' ':!common/mavlink/generated' ':!*_pb2.py' | grep -q .; then
            git ls-files -z -- '*.py' ':!common/mavlink/generated' ':!*_pb2.py' | xargs -0 mypy
          else
            echo ".py 파일 없음: mypy 건너뜀"
          fi

  mavlink:
    name: mavlink headers up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      # 로컬과 같은 pymavlink (tools/requirements-mavgen.txt). 다시 생성해 커밋본과 다르면 실패
      - run: pip install -r tools/requirements-mavgen.txt
      - run: tools/generate_mavlink.sh
      - run: git add -N common/mavlink/generated && git diff --exit-code --stat -- common/mavlink/generated

  proto:
    name: proto python up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # RPi 와 같은 apt protoc 3.21.12 로 다시 생성해 커밋본과 다르면 실패 (tools/generate_proto.sh)
      - run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends protobuf-compiler
      - run: tools/generate_proto.sh
      - run: git add -N onboard/libs/protocol/python && git diff --exit-code --stat -- onboard/libs/protocol/python

  gcs:
    name: gcs build · test · clang-tidy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install dependencies
        # Ubuntu 24.04 apt: qt6-base-dev 6.4 (Widgets·Network·Test 포함), OpenGL 헤더
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build qt6-base-dev libgl1-mesa-dev
          pip install clang-tidy==22.1.8
      - name: Configure
        run: cmake -S gcs -B build/gcs -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build/gcs
      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --test-dir build/gcs --output-on-failure
      - name: clang-tidy
        # compile_commands.json 에 있는 소스를 병렬로 검사. 경고도 실패로 (clang-tidy 는 경고만으로는 exit 0).
        # 마지막 인자: Qt moc 가 만든 소스(*_autogen/mocs_compilation.cpp)는 검사하지 않는다
        run: run-clang-tidy.py -p build/gcs -quiet -warnings-as-errors='*' '^(?!.*_autogen)'

  onboard:
    name: onboard build · test · clang-tidy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install dependencies
        # Ubuntu 24.04 apt: ZeroMQ + cppzmq(C++ 바인딩), protobuf(런타임, protoc 3.21.12), gtest. RPi(Ubuntu 24.04)와 같은 패키지
        # GStreamer 1.24 (영상 송신부): 개발 패키지 3개와, 테스트가 실행하는 요소(jpegenc, rtpjpegpay, rtppassthroughpay, rtspsrc 등)가 있는 plugins-base, plugins-good
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build libzmq3-dev cppzmq-dev libprotobuf-dev protobuf-compiler libgtest-dev
          sudo apt-get install -y --no-install-recommends pkg-config libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev libgstrtspserver-1.0-dev gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-plugins-ugly
          pip install clang-tidy==22.1.8
      - name: Configure
        # 설정은 onboard/CMakePresets.json 의 linux preset (빌드 폴더 build/onboard)
        run: cmake --preset linux
        working-directory: onboard
      - name: Build
        run: cmake --build build/onboard
      - name: Test
        run: ctest --test-dir build/onboard --output-on-failure
      - name: clang-tidy
        # compile_commands.json 에 있는 소스를 병렬로 검사. 경고도 실패로 (clang-tidy 는 경고만으로는 exit 0).
        # 컴파일할 소스가 하나도 없으면 CMake 가 compile_commands.json 을 만들지 않으므로 건너뛴다.
        # 마지막 인자: protobuf 생성 소스(*/generated/*.pb.cc)는 검사하지 않는다
        run: |
          if [ -f build/onboard/compile_commands.json ]; then
            run-clang-tidy.py -p build/onboard -quiet -warnings-as-errors='*' '^(?!.*/generated/)'
          else
            echo "compile_commands.json 없음: 컴파일할 소스가 없어 건너뜀"
          fi

  # bus 인터페이스의 Fast DDS 구현 (onboard/libs/bus_dds). Ubuntu 24.04 apt 에 Fast DDS 3.6 이 없으므로 소스
  # 빌드하여 캐시한다 (버전이 바뀌면 key 를 바꾼다). 버전은 README.md 의 Fast DDS 설치와 같다
  onboard-dds:
    name: onboard bus_dds (Fast DDS) build, test, clang-tidy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install dependencies
        # onboard 작업과 같은 패키지 + Fast DDS 빌드에 사용하는 libtinyxml2-dev
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build libzmq3-dev cppzmq-dev libprotobuf-dev protobuf-compiler libgtest-dev libtinyxml2-dev
          sudo apt-get install -y --no-install-recommends pkg-config libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev libgstrtspserver-1.0-dev gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-plugins-ugly
          pip install clang-tidy==22.1.8
      - name: Cache Fast DDS
        id: cache-fastdds
        uses: actions/cache@v6
        with:
          path: ~/.local/fastdds
          key: fastdds-3.6.2-fastcdr-2.3.7-foonathan-1.4.1-${{ runner.os }}
      - name: Build Fast DDS
        if: steps.cache-fastdds.outputs.cache-hit != 'true'
        # 설치 위치는 onboard/CMakePresets.json 의 linux-dds preset 이 찾는 $HOME/.local/fastdds
        run: |
          FASTDDS_PREFIX="$HOME/.local/fastdds"
          git -c advice.detachedHead=false clone -q --depth 1 --branch v1.4.1 https://github.com/eProsima/foonathan_memory_vendor.git /tmp/foonathan
          git -c advice.detachedHead=false clone -q --depth 1 --branch v2.3.7 https://github.com/eProsima/Fast-CDR.git /tmp/fastcdr
          git -c advice.detachedHead=false clone -q --depth 1 --branch v3.6.2 https://github.com/eProsima/Fast-DDS.git /tmp/fastdds
          git -C /tmp/fastdds submodule update -q --init --depth 1 thirdparty/asio
          cmake -S /tmp/foonathan -B /tmp/foonathan/build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$FASTDDS_PREFIX"
          cmake --build /tmp/foonathan/build && cmake --install /tmp/foonathan/build
          cmake -S /tmp/fastcdr -B /tmp/fastcdr/build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$FASTDDS_PREFIX"
          cmake --build /tmp/fastcdr/build && cmake --install /tmp/fastcdr/build
          cmake -S /tmp/fastdds -B /tmp/fastdds/build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$FASTDDS_PREFIX" -DCMAKE_PREFIX_PATH="$FASTDDS_PREFIX" -DTHIRDPARTY_Asio=FORCE -DTHIRDPARTY_fastcdr=OFF -DTHIRDPARTY_TinyXML2=OFF -DSECURITY=OFF -DCOMPILE_EXAMPLES=OFF -DBUILD_TESTING=OFF -DCOMPILE_TOOLS=OFF
          cmake --build /tmp/fastdds/build && cmake --install /tmp/fastdds/build
      - name: Configure
        # 설정은 onboard/CMakePresets.json 의 linux-dds preset (빌드 폴더 build/onboard)
        run: cmake --preset linux-dds
        working-directory: onboard
      - name: Build
        run: >-
          cmake --build build/onboard --target bus_dds_test bus_dds_transport_test
          vehicle_api_bus_dds_types_test vehicle_api_bus_dds_end_to_end_test
      - name: Test
        run: ctest --test-dir build/onboard --output-on-failure -R "DdsBus|FastDdsServiceApi|DdsTypes|DdsEndToEnd"
      - name: clang-tidy
        # bus_dds 와 vehicle_api_bus 의 DDS 변환 소스만 검사한다 (나머지는 onboard 작업이 검사).
        # fastddsgen 생성 소스(generated/)는 제외
        run: >-
          run-clang-tidy.py -p build/onboard -quiet -warnings-as-errors='*'
          'bus_dds/(src|test)/[a-z_]+\.cpp|vehicle_api_bus/(src|test)/(dds_[a-z_]+|[a-z_]+_idl|idl_common)\.cpp'
